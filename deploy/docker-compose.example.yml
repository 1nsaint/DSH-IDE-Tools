# Stock DeepSeek Harness + DSH IDE Tools (plugins installed into ./data via install script).
#
# Quick start:
#   cp .env.example .env    # set DOCKER_GID
#   ../scripts/install-ide-tools.sh --dsh-home ./data
#   (cd certs && openssl …)  # see certs/README.md — needed for the HTTPS sidecar
#   docker compose -f docker-compose.example.yml up -d --build
#   open http://127.0.0.1:3080  or  https://127.0.0.1:3443
#
# Three services (same pattern as ProDesk):
#   harness     — Web UI (HTTP :3080)
#   https       — TLS sidecar in harness netns (HTTPS :3443); recreate with harness
#   automation  — background worker for Cron/Automation schedules
#
# LAN from another PC: http://<host-lan-ip>:3080 (no sidecar required for plain HTTP).
# Public HTTPS domain: point your reverse proxy at host:3443.
#
# Security: Docker socket mount grants full host Docker control. Remove it if you
# do not need Containers/Database tabs. Keep agent preset workspace-write.

services:
  harness:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DSH_VERSION: ${DSH_VERSION:-0.1.1-rc.2}
    image: dsh-ide-tools-harness:local
    container_name: dsh-ide-tools
    restart: unless-stopped
    ports:
      # HTTPS sidecar shares this network namespace — publish both here
      - "${DSH_PORT:-3080}:3080"
      - "${DSH_HTTPS_PORT:-3443}:3443"
    command:
      - --profile
      - web
      - --patch
      - /opt/dsh-ide-tools/web.cordis.patch.yml
      - --no-open
      - --trusted-host
      - 127.0.0.1
      - 127.0.0.1:${DSH_PORT:-3080}
      - localhost
      - localhost:${DSH_PORT:-3080}
    environment:
      DSH_TELEMETRY_DISABLED: "1"
      HOME: /workspace
      DOCKER_HOST: unix:///var/run/docker.sock
      # Optional LLM defaults (otherwise use Settings → Models after first boot):
      # OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL}
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
    group_add:
      - "${DOCKER_GID:-983}"
    volumes:
      - ./data:/home/node/.dsh
      - ./workspace:/workspace
      # Optional: SSH keys for dsh-ssh-workspace remote workspaces (read-only)
      # - ${HOME}/.ssh:/home/node/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5

  # Background Cron/Automation worker (same image + $DSH_HOME). Not started by a plugin toggle.
  automation:
    image: dsh-ide-tools-harness:local
    container_name: dsh-ide-tools-automation
    restart: unless-stopped
    command:
      - --profile
      - automation
      - worker
    environment:
      DSH_TELEMETRY_DISABLED: "1"
      HOME: /workspace
      DOCKER_HOST: unix:///var/run/docker.sock
      # OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL}
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
    group_add:
      - "${DOCKER_GID:-983}"
    volumes:
      - ./data:/home/node/.dsh
      - ./workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      harness:
        condition: service_healthy

  # Same netns as harness → proxy to 127.0.0.1 so privileged Settings APIs work over HTTPS.
  # Must be recreated whenever harness is recreated (not just restarted alone).
  https:
    image: nginx:alpine
    container_name: dsh-ide-tools-https
    restart: unless-stopped
    network_mode: "service:harness"
    volumes:
      - ./nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - harness
