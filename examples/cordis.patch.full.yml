# User / site overlays after bundle layers.
# Plugins load via dsh.profile.bundles (see profile.package.json.full) — do not re-insert those ids.
# Copy to $DSH_HOME/profiles/web/cordis.patch.yml and edit personal LLM / timezone values.
- id: web
  config:
    searchProvider: multi-search
- id: dsh-automation-startup
  disabled: true
- id: dsh-automation-app
  disabled: true
- id: dsh-cron
  config:
    defaultCwd: /workspace
# Optional personal overrides (examples — remove or edit):
# - id: dsh-runtime-clock
#   config:
#     timezone: UTC
#     granularity: hour
